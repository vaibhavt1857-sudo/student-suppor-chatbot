<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Center</title>

  <!-- Modern Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #090d16;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
      --badge-bg: rgba(255, 255, 255, 0.05);
      --badge-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle Ambient Background Glows */
    .ambient-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      z-index: -1;
      opacity: 0.15;
      pointer-events: none;
    }
    .glow-1 { top: -100px; left: -100px; background: var(--accent-cyan); }
    .glow-2 { bottom: -100px; right: -100px; background: var(--accent-purple); }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 680px;
      animation: fadeIn 0.8s ease-out;
    }

    /* Glass Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    /* Header Bar with Right-Aligned Status Badge */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--card-border);
      gap: 1rem;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Status Badge ("no update for now") */
    .update-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1rem;
      border-radius: 50px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-muted);
      opacity: 0.7;
    }

    /* Card Content */
    .content {
      text-align: left;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 60%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    /* Interactive Refresh Section */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1.5rem;
      border-top: 1px solid var(--card-border);
      font-size: 0.875rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 0.6rem 1.25rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .card { padding: 1.75rem; }
      h1 { font-size: 1.75rem; }
      .header-bar { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
      .update-badge { align-self: flex-start; }
    }
  </style>
</head>
<body>

  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="container">
    <div class="card">
      
      <!-- Header with Status Badge on the Right -->
      <div class="header-bar">
        <div class="brand-title">
          <span>🔔</span> System Feed
        </div>
        <div class="update-badge" id="updateBadge">
          <span class="status-dot"></span>
          <span>no update for now</span>
        </div>
      </div>

      <!-- Main Content Block -->
      <div class="content">
        <h1>All Quiet On The Feed</h1>
        <p>Everything is currently up to date. Check back later for new announcements, system updates, or notifications.</p>
      </div>

      <!-- Interactive Footer -->
      <div class="action-bar">
        <span id="lastChecked">Last checked: Just now</span>
        <button class="refresh-btn" id="checkBtn">
          <span>🔄</span> Check for Updates
        </button>
      </div>

    </div>
  </main>

  <script>
    const checkBtn = document.getElementById('checkBtn');
    const updateBadge = document.getElementById('updateBadge');
    const lastChecked = document.getElementById('lastChecked');

    checkBtn.addEventListener('click', () => {
      // Visual Feedback
      checkBtn.style.opacity = '0.6';
      checkBtn.innerHTML = '<span>⏳</span> Checking...';

      setTimeout(() => {
        checkBtn.style.opacity = '1';
        checkBtn.innerHTML = '<span>🔄</span> Check for Updates';
        
        // Update Time
        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        lastChecked.textContent = `Last checked: ${timeString}`;

        // Pulsing animation to confirm badge check
        updateBadge.style.transform = 'scale(1.05)';
        setTimeout(() => updateBadge.style.transform = 'scale(1)', 200);
      }, 800);
    });
  </script>
</body>
</html>
